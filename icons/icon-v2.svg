<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- MSTY 기록장: 초록 통장 표지 + 통장 쪽(머리 띠와 괘선) + "재"(재매수) 도장 -->
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4c3e"/>
      <stop offset="1" stop-color="#123529"/>
    </linearGradient>
    <g id="mark">
      <!-- 통장 쪽 -->
      <rect x="92" y="86" width="276" height="304" rx="22" fill="#fcf9ef"/>
      <path d="M92 108a22 22 0 0 1 22-22h232a22 22 0 0 1 22 22v34H92z" fill="#cfe0d4"/>
      <path d="M126 196H334M126 252H334M126 308H230" stroke="#6d8f81" stroke-width="16" stroke-linecap="round"/>
      <!-- 도장: 종이색 바탕 + 겹테두리 + "재" -->
      <g transform="rotate(-10 342 346)">
        <circle cx="342" cy="346" r="104" fill="#fcf9ef"/>
        <circle cx="342" cy="346" r="92" fill="none" stroke="#b5301b" stroke-width="18"/>
        <circle cx="342" cy="346" r="68" fill="none" stroke="#b5301b" stroke-width="6"/>
        <g transform="translate(342 346)" fill="none" stroke="#b5301b" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
          <path d="M-44 -30H-6"/>
          <path d="M-24 -28L-46 32"/>
          <path d="M-25 -2L-4 30"/>
          <path d="M14 -42V42M14 0H26"/>
          <path d="M40 -46V46"/>
        </g>
      </g>
    </g>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#cover)"/>
  <rect x="28" y="28" width="456" height="456" rx="90" fill="none" stroke="#e8cc86" stroke-width="7" opacity="0.85"/>
  <rect x="44" y="44" width="424" height="424" rx="76" fill="none" stroke="#e8cc86" stroke-width="3" opacity="0.55"/>
  <use href="#mark"/>
</svg>
